<style>
  :root {
    --bg: #0b0b0d; --bg2: #0f0f12; --panel: #121215; --panel2: #18181c; --raise: #1e1e23; --hover: #24242a;
    --line: #232328; --line2: #303037; --text: #eeeae2; --mute: #9b978e; --faint: #87837b;
    --gold: #e7c47e; --gold-hi: #f6e2ae; --gold-lo: #b88c42; --gold-ink: #1d1508; --gold-soft: #e7c47e1f;
    --warn: #f1aa6b; --ok: #8bd1a7; --info: #a3b8ff;
    --r: 12px; --r-s: 8px;
    --serif: 'Instrument Serif', 'Cormorant Garamond', Georgia, serif;
    --sans: Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --shadow: 0 1px 0 #ffffff08 inset, 0 12px 40px #00000066;
    --ease: cubic-bezier(.2, .7, .2, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  ::selection { background: #e7c47e55; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a2a31; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: #3a3a43; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── frame ── */
  body { display: grid; grid-template-rows: 56px minmax(0, 1fr); overflow: hidden; }
  header.top { display: flex; align-items: center; gap: 18px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #121215, #0e0e11); position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); flex: none; }
  .brand .mark { width: 30px; height: 30px; display: grid; place-items: center; }
  .brand .mark svg { width: 30px; height: 30px; display: block; }
  .brand .word { font: 400 25px/1 var(--serif); letter-spacing: .01em; }
  .brand .word i { color: var(--gold); font-style: italic; }
  .brand small { display: block; font: 500 11.5px/1.2 var(--sans); color: var(--mute); margin-top: 3px; white-space: nowrap; }
  .top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .modes { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .modes button { background: none; border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer; color: var(--mute); font-weight: 600; transition: color .15s, background .15s; }
  .modes button:hover { color: var(--text); }
  .modes button.on { background: var(--raise); color: var(--text); box-shadow: 0 1px 0 #ffffff12 inset, 0 1px 3px #0006; }
  .shell { display: grid; grid-template-columns: 76px 372px minmax(0, 1fr); min-height: 0; }

  /* ── buttons ── */
  .btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 9px; padding: 7px 12px; cursor: pointer; white-space: nowrap; font-weight: 600; transition: border-color .15s, background .15s, transform .1s; display: inline-flex; align-items: center; gap: 7px; justify-content: center; }
  .btn:hover { border-color: #45454f; background: var(--raise); }
  .btn:active { transform: translateY(1px); }
  .btn.small { padding: 4px 9px; font-size: 12px; border-radius: 7px; font-weight: 600; }
  .btn.ghost { background: transparent; }
  .btn.primary, .btn.gold { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo)); color: var(--gold-ink); border-color: #c79d55; box-shadow: 0 1px 0 #fff6 inset, 0 6px 18px #e7c47e26; }
  .btn.primary:hover, .btn.gold:hover { filter: brightness(1.06); border-color: #e2b96e; }
  .btn.on { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--mute); }
  .icon-btn:hover { background: var(--raise); color: var(--text); border-color: var(--line2); }
  .icon-btn svg { width: 18px; height: 18px; }
  .kbd { font: 600 10.5px var(--sans); color: var(--faint); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 5px; margin-left: 4px; }

  /* ── rail ── */
  .rail { background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; overflow-y: auto; }
  .rail button { background: none; border: 0; border-radius: 10px; padding: 9px 2px 7px; cursor: pointer; color: var(--mute); display: grid; justify-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .01em; transition: color .15s, background .15s; position: relative; }
  .rail button svg { width: 22px; height: 22px; }
  .rail button:hover { color: var(--text); background: var(--panel); }
  .rail button.on { color: var(--gold); background: var(--gold-soft); }
  .rail button.on::before { content: ''; position: absolute; left: -8px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--gold); }
  .rail .grow { flex: 1; }
  .rail .about { font-weight: 500; color: var(--faint); }

  /* ── panel ── */
  aside.panel { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
  .tabhead { position: sticky; top: 0; z-index: 3; background: linear-gradient(180deg, var(--panel) 80%, #12121500); padding: 18px 20px 10px; }
  .tabhead h2 { margin: 0; font: 400 26px/1.1 var(--serif); letter-spacing: .005em; }
  .tabhead p { margin: 4px 0 0; color: var(--mute); font-size: 12.5px; }
  .tabhead .actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .pane { padding: 4px 20px 28px; display: grid; gap: 14px; }
  .group { display: grid; gap: 9px; }
  .group > .label, .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); display: flex; align-items: center; gap: 8px; }
  .label .opt { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }
  .label .grow { flex: 1; height: 1px; background: var(--line); }
  details.fold { border-top: 1px solid var(--line); }
  details.fold > summary { list-style: none; cursor: pointer; padding: 13px 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: ''; width: 8px; height: 8px; border-right: 1.5px solid var(--mute); border-bottom: 1.5px solid var(--mute); transform: rotate(45deg) translate(-2px, -2px); transition: transform .2s var(--ease); }
  details.fold[open] > summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
  details.fold > summary small { font-weight: 500; color: var(--faint); margin-left: 8px; }
  details.fold > .body { display: grid; gap: 9px; padding-bottom: 16px; }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); margin-top: 6px; font-weight: 700; }
  .hint { color: var(--mute); font-size: 12px; line-height: 1.5; }
  .hint b { color: var(--text); font-weight: 600; }
  .hint a { color: var(--gold); text-decoration-color: #e7c47e66; }

  /* ── controls ── */
  .row { display: grid; grid-template-columns: 104px 1fr 42px; align-items: center; gap: 10px; min-height: 26px; }
  .row.wide { grid-template-columns: 104px 1fr; }
  .row label { color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row output { text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--gold) var(--p, 50%), #33333b var(--p, 50%)); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: #33333b; }
  input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--gold); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #f4ecdc; border: 0; margin-top: -5.5px; box-shadow: 0 0 0 3px #0b0b0d, 0 1px 4px #000a; transition: transform .1s; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #f4ecdc; border: 0; box-shadow: 0 0 0 3px #0b0b0d; }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15); }
  select, input[type=text], input[type=number], input[type=search], textarea { background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 9px; width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s; }
  select { -webkit-appearance: none; appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; cursor: pointer; }
  select:hover, input[type=text]:hover, input[type=search]:hover { border-color: #43434c; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px #e7c47e22; }
  textarea { resize: vertical; min-height: 64px; font-family: ui-monospace, monospace; font-size: 12px; }
  input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line2); border-radius: 7px; background: none; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; }
  input[type=checkbox] { accent-color: var(--gold); width: 15px; height: 15px; margin: 0; vertical-align: -2px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--mute); font-size: 12.5px; user-select: none; }
  .switch input { -webkit-appearance: none; appearance: none; width: 30px; height: 18px; border-radius: 18px; background: #34343c; position: relative; transition: background .2s; cursor: pointer; flex: none; }
  .switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #e8e3d8; transition: transform .2s var(--ease); }
  .switch input:checked { background: var(--gold-lo); }
  .switch input:checked::after { transform: translateX(12px); background: #fff7e6; }
  .switch:hover { color: var(--text); }
  .seg { display: flex; flex-wrap: wrap; gap: 5px; }
  .seg button { flex: 1 0 auto; }
  .segctl { display: flex; background: var(--bg2); border: 1px solid var(--line2); border-radius: 9px; padding: 2px; gap: 2px; }
  .segctl button { flex: 1; background: none; border: 0; border-radius: 7px; padding: 5px 8px; cursor: pointer; color: var(--mute); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .segctl button:hover { color: var(--text); }
  .segctl button.on { background: var(--raise); color: var(--text); box-shadow: 0 1px 0 #ffffff10 inset, 0 1px 2px #0008; }

  /* ── chips ── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line2); background: var(--panel2); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: #d9d4ca; transition: all .15s var(--ease); white-space: nowrap; }
  .chip:hover { border-color: #4a4a54; color: var(--text); background: var(--raise); }
  .chip.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .chip.quiet { background: transparent; border-style: dashed; color: var(--mute); }
  .chip small { color: var(--faint); font-weight: 500; margin-left: 4px; }

  /* ── words ── */
  .q { display: grid; gap: 8px; }
  .q h3 { margin: 0; font: 400 19px/1.2 var(--serif); color: var(--text); letter-spacing: .005em; }
  .q h3 em { color: var(--gold); font-style: italic; }
  .q .num { font: 600 11px var(--sans); color: var(--gold); border: 1px solid #e7c47e55; border-radius: 50%; width: 19px; height: 19px; display: inline-grid; place-items: center; margin-right: 8px; vertical-align: 2px; }
  .bigin { font-size: 15px !important; padding: 10px 12px !important; border-radius: 10px !important; background: var(--bg2); }
  .combo { position: relative; }
  .combo .list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: #18181d; border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 20px 60px #000c; z-index: 20; overflow: hidden; display: none; max-height: 360px; overflow-y: auto; }
  .combo.open .list { display: block; }
  .combo .opt { padding: 9px 12px; cursor: pointer; display: grid; gap: 1px; border-bottom: 1px solid #ffffff08; }
  .combo .opt:last-child { border-bottom: 0; }
  .combo .opt b { font-weight: 650; color: var(--text); }
  .combo .opt span { font-size: 11.5px; color: var(--mute); }
  .combo .opt.act, .combo .opt:hover { background: #26262d; }
  .combo .opt mark { background: none; color: var(--gold); }
  .fcard { border: 1px solid var(--line2); background: linear-gradient(180deg, #19191e, #141418); border-radius: 12px; padding: 12px 13px; display: grid; gap: 8px; }
  .fcard .t { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .fcard .t b { font-size: 13.5px; font-weight: 700; }
  .fcard .meta { font-size: 12px; color: var(--mute); }
  .fcard .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .fcard .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; }
  .fcard .tag.gold { color: var(--gold); border-color: #e7c47e55; }
  .fcard .rules { display: grid; gap: 6px; }
  .fcard .rule { font-size: 12px; color: #d9d3c6; display: flex; gap: 8px; line-height: 1.45; }
  .fcard .rule::before { content: '§'; flex: none; width: 16px; height: 16px; border-radius: 50%; background: #3a2d14; color: var(--gold); display: grid; place-items: center; font-size: 10px; font-weight: 800; margin-top: 1px; }
  .fcard .rule.tip::before { content: 'i'; background: #222a3d; color: var(--info); }
  .fcard .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .fcard a.site { color: var(--gold); font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .fcard a.site:hover { text-decoration: underline; }
  .yearrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .lines { display: grid; gap: 6px; }

  /* field rows (every line) */
  .field { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: start; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; transition: border-color .15s; }
  .field:hover { border-color: var(--line2); }
  .field.off { opacity: 0.45; }
  .field input.example { font-style: italic; color: var(--mute); }
  .field.sel { border-color: #e7c47e99; box-shadow: 0 0 0 3px #e7c47e14; }
  .field.drag-over { border-style: dashed; border-color: var(--gold); }
  .field .handle { cursor: grab; color: var(--faint); user-select: none; padding-top: 6px; font-size: 11px; letter-spacing: -2px; }
  .field .logo-in { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--mute); }
  .field .logo-in .logo-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field .meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 6px; }
  .field .meta select { padding: 3px 22px 3px 7px; font-size: 11.5px; background-position: calc(100% - 11px) 50%, calc(100% - 7px) 50%; }
  .field .flags { display: flex; gap: 12px; margin-top: 6px; color: var(--mute); font-size: 11.5px; align-items: center; flex-wrap: wrap; }
  .field .flags label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .field .tools { display: grid; gap: 4px; }
  .field .tools .btn { width: 26px; height: 24px; padding: 0; }

  /* ── preset gallery ── */
  .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .presets.three { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .preset { background: #08080a; border: 1px solid var(--line); border-radius: 11px; padding: 0; cursor: pointer; overflow: hidden; display: grid; text-align: left; transition: border-color .15s, transform .2s var(--ease), box-shadow .2s; position: relative; }
  .preset:hover { border-color: #e7c47e88; transform: translateY(-1px); box-shadow: 0 10px 26px #0009; }
  .preset .thumb { aspect-ratio: 1; display: grid; place-items: center; background: #0d0d10; }
  .preset .thumb svg { width: 100%; height: 100%; display: block; }
  .preset span { font-size: 12px; padding: 7px 9px 1px; color: #d8d3c9; font-weight: 600; }
  .preset small { font-size: 10.5px; line-height: 1.3; padding: 0 9px 8px; color: var(--faint); }
  .preset.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .preset.on span { color: var(--gold); }
  .preset.on::after { content: '✓'; position: absolute; top: 7px; right: 7px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; font-size: 11px; font-weight: 900; }
  .filter { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .filter::-webkit-scrollbar { display: none; }
  .palettes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .palettes button { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--line2); cursor: pointer; padding: 0; position: relative; overflow: hidden; }
  .palettes button:hover { border-color: var(--gold); transform: scale(1.05); }
  .palettes button i { position: absolute; inset: 22%; border-radius: 50%; }
  .paint { display: grid; gap: 7px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 9px; }
  .paint .head { display: flex; gap: 7px; align-items: center; }
  .paint .head select { width: auto; flex: none; }
  .paint .stops { display: grid; gap: 5px; }
  .paint .stop { display: grid; grid-template-columns: 30px 1fr 24px; gap: 7px; align-items: center; }
  .paint .lbl { font-size: 12.5px; color: var(--text); flex: 1; font-weight: 600; }
  .paint .sw { width: 18px; height: 18px; border-radius: 5px; flex: none; box-shadow: 0 0 0 1px #ffffff22 inset; }
  .role { display: grid; gap: 8px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 11px; }
  .role > b { font-size: 12.5px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

  /* ── about ── */
  .about-pane p { color: #cfc9bd; font-size: 13px; line-height: 1.6; margin: 0; }
  .about-pane .pledge { display: grid; gap: 8px; }
  .about-pane .pledge div { display: flex; gap: 10px; align-items: baseline; color: #d9d3c6; }
  .about-pane .lead { font: 400 22px/1.25 var(--serif); color: var(--text); }
  .about-pane .guide { display: grid; gap: 9px; scroll-margin-top: 96px; }
  .about-pane .guide .tip { font-size: 12.5px; line-height: 1.55; color: #cfc9bd; padding-left: 12px; border-left: 2px solid var(--line2); }
  .about-pane .guide .tip b { color: var(--text); font-weight: 650; }
  .intro a { color: var(--gold); white-space: nowrap; }
  .about-pane .why { border-top: 1px solid var(--line); padding-top: 14px; }
  .intro { margin: 2px 20px 6px; padding: 16px 16px 14px; border-radius: 14px; border: 1px solid #e7c47e40; background: radial-gradient(120% 140% at 0% 0%, #2a2210, #151310 60%); position: relative; }
  .intro h3 { margin: 0 26px 6px 0; font: 400 23px/1.15 var(--serif); }
  .intro p { margin: 0; color: #d6cfbf; font-size: 12.5px; line-height: 1.55; }
  .intro .x { position: absolute; top: 8px; right: 8px; }
  .about-pane .pledge div::before { content: '✦'; color: var(--gold); font-size: 11px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

  /* ── phones and small tablets ── */
  @media (max-width: 1100px) { .shell { grid-template-columns: 70px 330px minmax(0, 1fr); } .studio { grid-template-columns: 240px minmax(0, 1fr) 290px; } }
  @media (max-width: 860px) {
    body { grid-template-rows: auto minmax(0, 1fr); overflow: auto; height: auto; min-height: 100%; }
    html, body { height: auto; }
    header.top { flex-wrap: wrap; gap: 8px 10px; padding: 10px 12px; position: sticky; top: 0; }
    .brand small { display: none; }
    .modes { order: 3; width: 100%; justify-content: space-between; }
    .modes button { flex: 1; padding: 6px 4px; }
    .top-actions .btn.ghost .lbl { display: none; }
    .shell { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    main { order: 1; min-height: 58vh; }
    .stagearea { min-height: 58vh; }
    .rail { order: 2; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; position: sticky; top: 98px; z-index: 4; }
    .rail button { flex: 1 0 64px; }
    .rail button.on::before { left: 12px; right: 12px; top: auto; bottom: -6px; width: auto; height: 3px; border-radius: 3px 3px 0 0; }
    .rail .grow, .rail .about { display: none; }
    aside.panel { order: 3; overflow: visible; border-right: 0; }
    .tabhead { position: static; }
    .stagewrap { padding: 16px 16px 56px; }
    .stage svg { max-height: 52vh; }
    .small-sizes { position: static; margin: 0 16px 12px; }
    .scrim { padding: 0; }
    .modal { height: 100%; border-radius: 0; }
    .studio { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .studio > * { overflow: visible !important; }
    .studio .dests { display: grid; overflow-x: auto !important; }
    .studio .dests { border-right: 0; border-bottom: 1px solid var(--line); grid-auto-flow: column; grid-auto-columns: 220px; overflow-x: auto; overflow-y: hidden; }
    .studio .dgroup { display: none; }
    .studio .preview { min-height: 320px; height: 52vh; }
    .studio .opts { border-left: 0; }
    .studio.fixer { grid-template-columns: 1fr; }
    .studio.fixer .opts { border-left: 0; border-top: 1px solid var(--line); }
    .sigs { grid-template-columns: 1fr; }
    .report { bottom: 44px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Daphne, free festival laurel maker">
    <span class="mark" id="mark" aria-hidden="true"></span>
    <span><span class="word">Daph<i>ne</i></span><small>Make festival laurels for your film. It’s free.</small></span>
  </a>
  <div class="modes" id="modes" role="tablist" aria-label="View">
    <button class="on" data-mode="laurel" role="tab">Laurel</button>
    <button data-mode="poster" role="tab" title="See it on your poster: placement, readable ink, colors from the artwork">On poster</button>
    <button data-mode="row" role="tab" title="Several laurels in one look: same type size, prestige order">Row</button>
    <button data-mode="motion" role="tab" title="An animated end card: the leaves grow in, then a shimmer">Motion</button>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="undo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="icon-btn" id="redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="btn ghost" id="copy-link" aria-label="Copy a share link" title="A link that holds the whole laurel. Nothing is stored on a server."><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span class="lbl">Share link</span></button>
    <button class="btn gold" id="open-export" title="Every file you need: PNG, SVG, PDF, social, trailer, web, the whole kit (⌘E)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Export</button>
  </div>
</header>
<div class="shell">
  <nav class="rail" id="rail" role="tablist" aria-label="Edit"></nav>
  <aside class="panel" id="panel" aria-label="Controls"><div id="sections"></div></aside>
  <main id="main">
    <div class="modebar" id="modebar"></div>
    <div class="stagearea" id="stagearea">
      <div class="stagewrap" id="stagewrap"><div class="stage" id="stage"></div></div>
      <div class="report" id="report" aria-live="polite"></div>
      <div class="stagebar" id="stagebar"></div>
    </div>
    <div class="bottom">
      <div class="modepanel" id="modepanel"></div>
      <div class="notes" id="notes"></div>
    </div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
