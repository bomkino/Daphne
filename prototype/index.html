<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daphne — free festival laurel maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap">
<style>
  :root {
    --bg: #0d0e11; --panel: #15171c; --panel2: #1b1e24; --line: #262a32; --text: #e9e6df; --mute: #8d9099; --accent: #e3c27a; --accent-ink: #1a1408; --warn: #f2a65a; --ok: #7bc69a;
    --r: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Figtree, system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  header.brand { position: sticky; top: 0; z-index: 3; background: var(--panel); padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .01em; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 2px 0 10px; color: var(--mute); font-size: 12px; }
  .shuffles { display: flex; gap: 6px; flex-wrap: wrap; }
  .brand .history { position: absolute; top: 14px; right: 16px; display: flex; gap: 4px; }
  .brand .history .btn { font-size: 14px; padding: 2px 8px; }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #3a3f4a; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn.small { padding: 3px 7px; font-size: 12px; }
  .btn.on { border-color: var(--accent); color: var(--accent); }
  details { border-bottom: 1px solid var(--line); }
  summary { list-style: none; cursor: pointer; padding: 12px 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '+'; color: var(--mute); font-weight: 400; }
  details[open] summary::after { content: '–'; }
  .sec { padding: 0 16px 14px; display: grid; gap: 8px; }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); margin-top: 6px; }
  .row { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 8px; }
  .row.wide { grid-template-columns: 96px 1fr; }
  .row label { color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row output { text-align: right; color: var(--mute); font-variant-numeric: tabular-nums; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=text], input[type=number], textarea { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; width: 100%; min-width: 0; }
  textarea { resize: vertical; min-height: 64px; font-family: ui-monospace, monospace; font-size: 12px; }
  input[type=color] { width: 32px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { flex: 1 0 auto; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .preset { background: #0b0c0f; border: 1px solid var(--line); border-radius: 8px; padding: 0; cursor: pointer; overflow: hidden; display: grid; }
  .preset:hover { border-color: var(--accent); }
  .preset .thumb { aspect-ratio: 1; display: grid; place-items: center; }
  .preset .thumb svg { width: 100%; height: 100%; }
  .preset span { font-size: 11px; padding: 4px 6px; color: var(--mute); text-align: left; }
  .preset small { font-size: 10px; line-height: 1.25; padding: 0 6px 6px; color: #6f737b; text-align: left; }
  .preset.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .preset.on span { color: var(--accent); }
  .field.off { opacity: 0.5; }
  .field input.example { font-style: italic; color: var(--mute); }
  .field { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; align-items: start; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px; }
  .field.sel { border-color: var(--accent); }
  .field.drag-over { border-style: dashed; border-color: var(--accent); }
  .field .handle { cursor: grab; color: var(--mute); user-select: none; padding-top: 4px; }
  .field .logo-in { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--mute); }
  .field .logo-in .logo-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field .meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-top: 5px; }
  .field .meta select { padding: 3px 4px; font-size: 11.5px; }
  .field .flags { display: flex; gap: 8px; margin-top: 5px; color: var(--mute); font-size: 11.5px; align-items: center; flex-wrap: wrap; }
  .field .tools { display: grid; gap: 4px; }
  .paint { display: grid; gap: 6px; background: #121419; border: 1px solid var(--line); border-radius: 8px; padding: 7px; }
  .paint .head { display: flex; gap: 6px; align-items: center; }
  .paint .stops { display: grid; gap: 4px; }
  .paint .stop { display: grid; grid-template-columns: 32px 1fr 22px; gap: 6px; align-items: center; }
  .paint .lbl { font-size: 12px; color: var(--mute); flex: 1; }
  .role { display: grid; gap: 6px; background: #121419; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .role b { font-size: 12px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  main > .stagewrap { flex: 1 1 0; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .topbar .spacer { flex: 1; }
  .modes { display: flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
  .modes button { background: none; border: 0; border-radius: 7px; padding: 5px 11px; cursor: pointer; color: var(--mute); font-weight: 600; }
  .modes button:hover { color: var(--text); }
  .modes button.on { background: var(--accent); color: var(--accent-ink); }
  .modebar { display: none; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--mute); }
  .modebar.on { display: flex; }
  .modebar label { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .modebar input[type=range] { width: 110px; }
  .modebar select { width: auto; padding: 3px 6px; }
  .modebar .grow { flex: 1; }
  .stagewrap { position: relative; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 24px; }
  .stage { max-width: min(100%, 760px); aspect-ratio: auto; background: repeating-conic-gradient(#1a1c21 0 25%, #14161a 0 50%) 0 0/18px 18px; border-radius: 12px; box-shadow: 0 30px 80px #0008; overflow: hidden; }
  .stage svg { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 210px); margin: 0 auto; touch-action: none; }
  .stage text { cursor: move; }
  .stage.fitted { max-width: none; }
  .stage.wide { max-width: 100%; width: 100%; }
  .stage.wide > svg { width: 100%; height: auto; }
  .stage.poster { background: #000; position: relative; max-width: 100%; }
  .poster-wrap { position: relative; line-height: 0; touch-action: none; }
  .poster-wrap > img { display: block; max-width: 100%; max-height: calc(100vh - 230px); width: auto; height: auto; user-select: none; -webkit-user-drag: none; }
  .poster-wrap .laurel-layer { position: absolute; cursor: grab; touch-action: none; }
  .poster-wrap .laurel-layer:active { cursor: grabbing; }
  .poster-wrap .laurel-layer svg { width: 100%; height: 100%; max-height: none; pointer-events: none; }
  .poster-wrap .laurel-layer.picked { outline: 1px dashed #ffffff80; outline-offset: 4px; }
  .poster-empty { display: grid; place-items: center; gap: 10px; text-align: center; padding: 60px 40px; color: var(--mute); min-width: 420px; min-height: 360px; }
  .poster-empty b { color: var(--text); font-size: 15px; }
  .actual { display: grid; gap: 8px; justify-items: center; padding: 18px; background: #0b0c0f; }
  .actual canvas { image-rendering: auto; }
  .actual .hint { max-width: 420px; text-align: center; }
  .swatches { display: inline-flex; gap: 4px; align-items: center; }
  .swatches i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; box-shadow: 0 0 0 1px #ffffff22 inset; }
  .suggest { display: flex; gap: 8px; flex-wrap: wrap; }
  .suggest button { width: 92px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background-size: cover; background-position: center; overflow: hidden; cursor: pointer; display: grid; }
  .suggest button:hover { border-color: var(--accent); }
  .suggest button .thumb { aspect-ratio: 1; display: grid; place-items: center; }
  .suggest button .thumb svg { width: 100%; height: 100%; max-height: none; }
  .suggest button span { font-size: 10.5px; padding: 3px 5px; background: #000a; color: #ddd; text-align: left; }
  .contrast b { color: var(--text); }
  .contrast.bad b { color: var(--warn); }
  .contrast.good b { color: var(--ok); }
  .bottom { min-height: 0; }
  .modepanel { display: none; border-top: 1px solid var(--line); padding: 12px 16px; gap: 10px; max-height: 42vh; overflow: auto; }
  .modepanel.on { display: grid; }
  .rowtable { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 12px; }
  .rowtable th { text-align: left; color: var(--mute); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 0 4px; }
  .rowtable td { padding: 0 3px; vertical-align: middle; }
  .rowtable tr.item td { background: var(--panel2); }
  .rowtable tr.item td:first-child { border-radius: 7px 0 0 7px; } .rowtable tr.item td:last-child { border-radius: 0 7px 7px 0; }
  .rowtable tr.item.off { opacity: .5; }
  .rowtable tr.drag-over td { box-shadow: 0 -2px 0 var(--accent) inset; }
  .rowtable input[type=text] { padding: 4px 6px; background: #121419; }
  .rowtable .handle { cursor: grab; color: var(--mute); padding: 0 6px; user-select: none; }
  .rowtable .art { display: flex; gap: 8px; align-items: center; color: var(--mute); }
  .rowtable .art img { height: 26px; width: auto; background: #0004; border-radius: 4px; }
  .rowtools { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--mute); }
  .rowtools select { width: auto; padding: 3px 6px; }
  .rowtools input[type=range] { width: 100px; }
  .paste { display: grid; gap: 6px; }
  .notes { display: none; padding: 8px 16px; border-top: 1px solid var(--line); gap: 5px; font-size: 12px; }
  .notes.on { display: grid; }
  .note { display: flex; gap: 8px; align-items: baseline; color: var(--mute); }
  .note::before { content: 'i'; flex: none; width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 800; background: #2a3140; color: #a9c1ff; transform: translateY(2px); }
  .note.rule::before { content: '§'; background: #3a2d14; color: var(--accent); }
  .note b { color: var(--text); font-weight: 600; }
  .note a { color: var(--mute); text-decoration: underline; text-decoration-color: #ffffff40; white-space: nowrap; }
  .note button { margin-left: 4px; }
  .motion-stage { display: grid; place-items: center; }
  .motion-stage svg { max-height: calc(100vh - 240px); }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; min-width: 160px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .report { padding: 8px 16px 12px; border-top: 1px solid var(--line); color: var(--mute); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .report .warn { color: var(--warn); }
  .report .ok { color: var(--ok); }
  .hint { color: var(--mute); font-size: 11.5px; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; height: auto; } aside { order: 2; } main { order: 1; min-height: 70vh; } }
</style>
</head>
<body>
<div class="app">
  <aside id="panel">
    <header class="brand">
      <h1>Daph<span>ne</span></h1>
      <p>Free festival laurels for filmmakers · prototype</p>
      <div class="shuffles">
        <button class="btn primary" id="shuffle-all" title="New look (keeps your text)">Shuffle</button>
        <button class="btn" data-shuffle="wreath">Wreath</button>
        <button class="btn" data-shuffle="colour">Colour</button>
        <button class="btn" data-shuffle="type">Type</button>
      </div>
      <div class="history">
        <button class="btn small" id="undo" title="Undo (⌘Z)">↶</button>
        <button class="btn small" id="redo" title="Redo (⇧⌘Z)">↷</button>
      </div>
    </header>
    <div id="sections"></div>
  </aside>
  <main>
    <div class="topbar">
      <div class="modes" id="modes" role="tablist" aria-label="View">
        <button class="on" data-mode="laurel" role="tab">Laurel</button>
        <button data-mode="poster" role="tab" title="See it on your poster: placement, readable ink, colours from the artwork">On poster</button>
        <button data-mode="row" role="tab" title="A row of laurels in this look: same type size, prestige order">Row</button>
        <button data-mode="motion" role="tab" title="An animated end card: the leaves grow in, then a shimmer">Motion</button>
      </div>
      <span class="spacer"></span>
      <button class="btn" id="copy-link">Copy link</button>
      <button class="btn" id="dl-svg" title="Vector file. Text is turned into shapes unless you choose live text under Canvas & export">SVG</button>
      <button class="btn" id="dl-pdf" title="Vector PDF for print, text as shapes">PDF</button>
      <button class="btn primary" id="dl-png">PNG</button>
    </div>
    <div class="modebar" id="modebar"></div>
    <div class="stagewrap" id="stagewrap"><div class="stage" id="stage"></div></div>
    <div class="bottom">
      <div class="modepanel" id="modepanel"></div>
      <div class="notes" id="notes"></div>
      <div class="report" id="report"></div>
    </div>
  </main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
