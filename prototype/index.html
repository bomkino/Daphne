<style>
  @font-face { font-family: 'PD Head'; src: url('assets/fonts/pd-head.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'PD Body'; src: url('assets/fonts/pd-body.woff2') format('woff2'); font-weight: 300 800; font-display: swap; }
  @font-face { font-family: 'PD Body Alt'; src: url('assets/fonts/pd-body-alt.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'PD Eyebrow'; src: url('assets/fonts/pd-eyebrow.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
  :root {
    /* Daphne identity: Grove grounds, Paper words, New leaf accents, one Bloom per screen. Gold belongs to the laurels people make, never the interface. */
    --grove: #12291E; --grove-deep: #0B1B13; --paper: #F3F6EF; --new-leaf: #B8E59A; --bay: #1F5C3B; --bloom: #F59CC0;
    --bg: #0B1B13; --bg2: #0E2118; --panel: #12291E; --panel2: #173226; --raise: #1C3B2D; --hover: #224434;
    --line: #1E382B; --line2: #2A4A3A; --text: #F3F6EF; --mute: #A9BCAF; --faint: #96AE9F;
    --leaf: #B8E59A; --leaf-hi: #CDEFB6; --leaf-lo: #9DD07D; --leaf-ink: #12291E; --leaf-soft: #B8E59A1c;
    --warn: #F4B183; --ok: #A6E3B8; --info: #A9C4FF;
    --r: 12px; --r-s: 8px;
    --display: 'PD Head', Georgia, serif;
    --sans: 'PD Body', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --lead: 'PD Body Alt', 'PD Body', system-ui, sans-serif;
    --data: 'PD Eyebrow', 'PD Body', system-ui, sans-serif;
    --shadow: 0 1px 0 #ffffff08 inset, 0 12px 40px #00000066;
    --ease: cubic-bezier(.2, .7, .1, 1); --ease-settle: cubic-bezier(.33, 0, .15, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  ::selection { background: #b8e59a55; }
  :focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #28453a; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: #35584a; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── frame ── */
  body { display: grid; grid-template-rows: 56px minmax(0, 1fr); overflow: hidden; }
  header.top { display: flex; align-items: center; gap: 18px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #12291e, #0f241a); position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); flex: none; }
  .brand .logo { height: 29px; width: auto; display: block; }
  .tagline { margin: 0 0 0 -4px; font: 400 12.5px/1.25 var(--lead); color: var(--mute); white-space: nowrap; padding-left: 14px; border-left: 1px solid var(--line2); }
  .tagline b { font-weight: 500; color: var(--bloom); } /* the one Bloom on screen */
  .tagline .tl2 { display: block; }
  /* the way to her story: quiet beside the tagline, there on every screen */
  .tagline .her { color: var(--mute); text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: .2em; margin-left: 4px; }
  .tagline .her:hover { color: var(--leaf); text-decoration-color: currentColor; }
  /* just above the phone layout, the bar is a little too wide for its row: Share link keeps its icon and drops its word */
  @media (max-width: 960px) { .top-actions .btn.ghost .lbl { display: none; } }
  .top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .savestate { font-size: 12px; font-weight: 600; color: #ffb4a2; border: 1px solid currentColor; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .savestate[hidden] { display: none; }
  .top-actions .icon-btn:disabled { opacity: .35; cursor: default; }
  .modes { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .modes button { background: none; border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer; color: var(--mute); font-weight: 600; transition: color .15s, background .15s; }
  .modes button:hover { color: var(--text); }
  .modes button.on { background: var(--raise); color: var(--text); box-shadow: 0 1px 0 #ffffff12 inset, 0 1px 3px #0006; }
  .shell { display: grid; grid-template-columns: 76px 372px minmax(0, 1fr); min-height: 0; }

  /* ── buttons ── */
  .btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 9px; padding: 7px 12px; cursor: pointer; white-space: nowrap; font-weight: 600; transition: border-color .15s, background .15s, transform .1s; display: inline-flex; align-items: center; gap: 7px; justify-content: center; }
  .btn:hover { border-color: #3d604d; background: var(--raise); }
  .btn:active { transform: translateY(1px); }
  .btn.small { padding: 4px 9px; font-size: 12px; border-radius: 7px; font-weight: 600; }
  .btn.ghost { background: transparent; }
  .btn.primary { background: linear-gradient(180deg, var(--leaf-hi), var(--leaf) 55%, #a9dc89); color: var(--leaf-ink); border-color: #9dd07d; box-shadow: 0 1px 0 #fff6 inset, 0 6px 18px #b8e59a26; }
  .btn.primary:hover { filter: brightness(1.06); border-color: var(--leaf-hi); }
  .btn.on { border-color: var(--leaf); color: var(--leaf); background: var(--leaf-soft); }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--mute); }
  .icon-btn:hover { background: var(--raise); color: var(--text); border-color: var(--line2); }
  .icon-btn svg { width: 18px; height: 18px; }
  .kbd { font: 500 10.5px var(--data); color: var(--faint); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 5px; margin-left: 4px; }

  /* ── rail ── */
  .rail { background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; overflow-y: auto; }
  .rail button { background: none; border: 0; border-radius: 10px; padding: 9px 2px 7px; cursor: pointer; color: var(--mute); display: grid; justify-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .01em; transition: color .15s, background .15s; position: relative; }
  .rail button svg { width: 22px; height: 22px; }
  .rail button:hover { color: var(--text); background: var(--panel); }
  .rail button.on { color: var(--leaf); background: var(--leaf-soft); }
  .rail button.on::before { content: ''; position: absolute; left: -8px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--leaf); }
  .rail .grow { flex: 1; }
  .rail .about { font-weight: 500; color: var(--faint); }

  /* ── panel ── */
  aside.panel { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
  .tabhead { position: sticky; top: 0; z-index: 3; background: linear-gradient(180deg, var(--panel) 80%, #12291e00); padding: 18px 20px 10px; }
  .tabhead h2 { margin: 0; font: 400 26px/1.1 var(--display); letter-spacing: .005em; }
  .tabhead p { margin: 4px 0 0; color: var(--mute); font-size: 12.5px; }
  .tabhead .actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .pane { padding: 4px 20px 28px; display: grid; gap: 14px; }
  .group { display: grid; gap: 9px; }
  .group > .label, .label { font: 600 11.5px/1.3 var(--sans); letter-spacing: .01em; color: var(--mute); display: flex; align-items: center; gap: 8px; }
  .label .opt { letter-spacing: 0; font: 400 11.5px var(--sans); color: var(--faint); }
  .label .grow { flex: 1; height: 1px; background: var(--line); }
  details.fold { border-top: 1px solid var(--line); }
  details.fold > summary { list-style: none; cursor: pointer; padding: 13px 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: ''; width: 8px; height: 8px; border-right: 1.5px solid var(--mute); border-bottom: 1.5px solid var(--mute); transform: rotate(45deg) translate(-2px, -2px); transition: transform .2s var(--ease); }
  details.fold[open] > summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
  details.fold > summary small { font-weight: 500; color: var(--faint); margin-left: 8px; }
  details.fold > .body { display: grid; gap: 9px; padding-bottom: 16px; }
  .sub { font: 600 11.5px/1.3 var(--sans); letter-spacing: .01em; color: var(--mute); margin-top: 6px; }
  .hint { color: var(--mute); font-size: 12px; line-height: 1.5; }
  .hint b { color: var(--text); font-weight: 600; }
  .hint a { color: var(--leaf); text-decoration-color: #b8e59a66; }

  /* ── controls ── */
  .row { display: grid; grid-template-columns: 104px 1fr 42px; align-items: center; gap: 10px; min-height: 26px; }
  .row.wide { grid-template-columns: 104px 1fr; }
  .row label { color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row output { text-align: right; color: var(--faint); font: 500 11px var(--data); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--leaf) var(--p, 50%), #2c4a3b var(--p, 50%)); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: #2c4a3b; }
  input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--leaf); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #F3F6EF; border: 0; margin-top: -5.5px; box-shadow: 0 0 0 3px #0b1b13, 0 1px 4px #000a; transition: transform .1s; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #F3F6EF; border: 0; box-shadow: 0 0 0 3px #0b1b13; }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15); }
  select, input[type=text], input[type=number], input[type=search], textarea { background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 9px; width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s; }
  select { -webkit-appearance: none; appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; cursor: pointer; }
  select:hover, input[type=text]:hover, input[type=search]:hover { border-color: #3d604d; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--leaf); box-shadow: 0 0 0 3px #b8e59a22; }
  textarea { resize: vertical; min-height: 64px; font-family: ui-monospace, monospace; font-size: 12px; }
  input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line2); border-radius: 7px; background: none; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; }
  input[type=checkbox] { accent-color: var(--leaf); width: 15px; height: 15px; margin: 0; vertical-align: -2px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--mute); font-size: 12.5px; user-select: none; }
  .switch input { -webkit-appearance: none; appearance: none; width: 30px; height: 18px; border-radius: 18px; background: #2c4a3b; position: relative; transition: background .2s; cursor: pointer; flex: none; }
  .switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #dfe7da; transition: transform .2s var(--ease); }
  .switch input:checked { background: var(--leaf-lo); }
  .switch input:checked::after { transform: translateX(12px); background: #ffffff; }
  .switch:hover { color: var(--text); }
  .seg { display: flex; flex-wrap: wrap; gap: 5px; }
  .seg button { flex: 1 0 auto; }
  .segctl { display: flex; background: var(--bg2); border: 1px solid var(--line2); border-radius: 9px; padding: 2px; gap: 2px; }
  .segctl button { flex: 1; background: none; border: 0; border-radius: 7px; padding: 5px 8px; cursor: pointer; color: var(--mute); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .segctl button:hover { color: var(--text); }
  .segctl button.on { background: var(--raise); color: var(--text); box-shadow: 0 1px 0 #ffffff10 inset, 0 1px 2px #0008; }

  /* ── chips ── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line2); background: var(--panel2); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: #dbe3d6; transition: all .15s var(--ease); white-space: nowrap; }
  .chip:hover { border-color: #456a55; color: var(--text); background: var(--raise); }
  .chip.on { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf); }
  .chip.quiet { background: transparent; border-style: dashed; color: var(--mute); }
  .chip small { color: var(--faint); font-weight: 500; margin-left: 4px; }

  /* ── words ── */
  .q { display: grid; gap: 8px; }
  .q h3 { margin: 0; font: 400 19px/1.2 var(--display); color: var(--text); letter-spacing: .005em; }
  .q h3 em { color: var(--leaf); font-style: normal; }
  .q .num { font: 600 11px var(--sans); color: var(--leaf); border: 1px solid #b8e59a55; border-radius: 50%; width: 19px; height: 19px; display: inline-grid; place-items: center; margin-right: 8px; vertical-align: 2px; }
  .bigin { font-size: 15px !important; padding: 10px 12px !important; border-radius: 10px !important; background: var(--bg2); }
  .combo { position: relative; }
  .combo .list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: #16302a; border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 20px 60px #000c; z-index: 20; overflow: hidden; display: none; max-height: 360px; overflow-y: auto; }
  .combo.open .list { display: block; }
  .combo .opt { padding: 9px 12px; cursor: pointer; display: grid; gap: 1px; border-bottom: 1px solid #ffffff08; }
  .combo .opt:last-child { border-bottom: 0; }
  .combo .opt b { font-weight: 650; color: var(--text); }
  .combo .opt span { font-size: 11.5px; color: var(--mute); }
  .combo .opt.act, .combo .opt:hover { background: #224434; }
  .combo .opt mark { background: none; color: var(--leaf); }
  .fcard { border: 1px solid var(--line2); background: linear-gradient(180deg, #183428, #142c21); border-radius: 12px; padding: 12px 13px; display: grid; gap: 8px; }
  .fcard .t { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .fcard .t b { font-size: 13.5px; font-weight: 700; }
  .fcard .meta { font-size: 12px; color: var(--mute); }
  .fcard .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .fcard .tag { font: 600 11px/1.5 var(--sans); letter-spacing: .01em; color: var(--mute); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; }
  .fcard .tag.major { color: var(--leaf); border-color: #b8e59a55; }
  .fcard .rules { display: grid; gap: 6px; }
  .fcard .rule { font-size: 12px; color: #d8e1d3; display: flex; gap: 8px; line-height: 1.45; }
  .fcard .rule::before { content: '§'; flex: none; width: 16px; height: 16px; border-radius: 50%; background: #1F5C3B; color: var(--leaf); display: grid; place-items: center; font-size: 10px; font-weight: 800; margin-top: 1px; }
  .fcard .rule.tip::before { content: 'i'; background: #1c3040; color: var(--info); }
  .fcard .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .fcard a.site { color: var(--leaf); font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .fcard a.site:hover { text-decoration: underline; }
  .yearrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .lines { display: grid; gap: 6px; }

  /* field rows (every line) */
  .field { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: start; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; transition: border-color .15s; }
  .field:hover { border-color: var(--line2); }
  .field.off { opacity: 0.45; }
  .field input.example { color: var(--mute); }
  .field.sel { border-color: #b8e59a99; box-shadow: 0 0 0 3px #b8e59a14; }
  .field.drag-over { border-style: dashed; border-color: var(--leaf); }
  .field .handle { cursor: grab; color: var(--faint); user-select: none; padding-top: 6px; font-size: 11px; letter-spacing: -2px; }
  .stage-empty { margin: auto; max-width: 420px; padding: 24px; display: grid; gap: 12px; justify-items: center; text-align: center; color: var(--mute); font-size: 13.5px; line-height: 1.5; }
  .stage-empty p { margin: 0; }
  tr.example input { font-style: italic; color: var(--mute); }
  .row-examples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row-examples > span { flex: 1 1 260px; }
  .field .logo-in { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--mute); }
  .field .logo-in .logo-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* V06: each select is as wide as its longest choice and they wrap rather than cut a label short */
  .field .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .field .meta select { flex: 1 1 auto; width: auto; min-width: 0; padding: 3px 22px 3px 7px; font-size: 11.5px; background-position: calc(100% - 11px) 50%, calc(100% - 7px) 50%; }
  .field .flags { display: flex; gap: 12px; margin-top: 6px; color: var(--mute); font-size: 11.5px; align-items: center; flex-wrap: wrap; }
  .field .flags label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .field .tools { display: grid; gap: 4px; }
  .field .tools .btn { width: 26px; height: 24px; padding: 0; }

  /* ── preset gallery ── */
  .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .presets.three { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .preset { background: #0a1811; border: 1px solid var(--line); border-radius: 11px; padding: 0; cursor: pointer; overflow: hidden; display: grid; text-align: left; transition: border-color .15s, transform .2s var(--ease), box-shadow .2s; position: relative; }
  .preset:hover { border-color: #b8e59a88; transform: translateY(-1px); box-shadow: 0 10px 26px #0009; }
  .preset .thumb { aspect-ratio: 1; display: grid; place-items: center; background: #0c1d15; }
  .preset .thumb svg { width: 100%; height: 100%; display: block; }
  .preset span { font-size: 12px; padding: 7px 9px 1px; color: #d8e1d3; font-weight: 600; }
  .preset small { font-size: 10.5px; line-height: 1.3; padding: 0 9px 8px; color: var(--faint); }
  .preset.on { border-color: var(--leaf); box-shadow: 0 0 0 1px var(--leaf) inset; }
  .preset.on span { color: var(--leaf); }
  .preset.on::after { content: '✓'; position: absolute; top: 7px; right: 7px; width: 20px; height: 20px; border-radius: 50%; background: var(--leaf); color: var(--leaf-ink); display: grid; place-items: center; font-size: 11px; font-weight: 900; }
  .filter { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .filter::-webkit-scrollbar { display: none; }
  .palettes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }

  /* ── stage ── */

  .small-sizes { position: absolute; right: 16px; top: 16px; display: grid; gap: 8px; background: #0b1b13ee; border: 1px solid var(--line2); border-radius: 14px; padding: 12px; backdrop-filter: blur(10px); box-shadow: 0 20px 50px #000a; z-index: 3; max-width: calc(100% - 32px); }

  .stagearea.ss-side > .stagewrap { padding-right: calc(var(--ssw, 360px) + 32px); }

  .rowtable { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 12px; }

  .progress i { display: block; height: 100%; width: 0; background: var(--leaf); transition: width .1s; }

  .wordsheet h4 { margin: 0 0 6px; font: 600 11.5px/1 var(--sans); letter-spacing: .01em; color: #4f6658; }
  .wordsheet ul { margin: 0 0 18px; padding-left: 18px; } .wordsheet p { margin: 0; }
  .ways button .sw.light { background: repeating-conic-gradient(#ebe7df 0 25%, #f7f5f0 0 50%) 0 0/10px 10px; }
  .ways button .sw.dark { background: repeating-conic-gradient(#1d1d22 0 25%, #141418 0 50%) 0 0/10px 10px; }
  .studio.fixer { grid-template-columns: minmax(0, 1fr) 330px; }
  .studio.fixer .opts { border-left: 1px solid var(--line); }
  .dropzone { width: min(520px, 100%); aspect-ratio: 1.6; border: 1.5px dashed #456a55; border-radius: 16px; background: #ffffff05; display: grid; place-content: center; gap: 6px; text-align: center; cursor: pointer; color: var(--mute); transition: border-color .15s, background .15s; }
  .dropzone:hover { border-color: var(--leaf); background: var(--leaf-soft); color: var(--text); }
  .dropzone b { font: 400 26px/1.1 var(--display); color: var(--text); }
  .beforewrap { display: flex; gap: 10px; align-items: center; font-size: 11.5px; color: var(--faint); }
  .beforewrap .before { height: 54px; max-width: 160px; object-fit: contain; border-radius: 6px; border: 1px solid var(--line2); background: #fff; }
  .studio .preview .frame canvas { display: block; }
  .ways { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ways button { border: 1px solid var(--line2); border-radius: 10px; background: var(--bg2); cursor: pointer; padding: 6px; display: grid; gap: 5px; justify-items: center; font-size: 11.5px; font-weight: 600; color: var(--mute); }
  .ways button .sw { width: 100%; aspect-ratio: 1.4; border-radius: 6px; display: grid; place-items: center; overflow: hidden; }
  .ways button .sw svg { width: 80%; height: 80%; }
  .ways button.on { border-color: var(--leaf); color: var(--leaf); background: var(--leaf-soft); }
  .checks { display: grid; gap: 7px; }
  .checks label { display: flex; gap: 9px; align-items: center; font-size: 12.5px; color: #d3dccf; cursor: pointer; }
  .checks label small { color: var(--faint); margin-left: auto; font-size: 11px; text-align: right; }
  .studio .opts .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .studio .opts .pair .btn { padding: 8px 12px; font-size: 13px; }
  /* the pitch.dog note in Export › Pitch deck: a sibling of the first-visit intro card, quieter than the downloads above it */
  .pd-tie { margin-top: 4px; padding: 16px 16px 14px; border-radius: 14px; border: 1px solid var(--line2); background: radial-gradient(120% 140% at 100% 0%, #1c3d2c, #12291e 62%); display: grid; gap: 10px; min-width: 0; }
  .pd-tie p { margin: 0; text-wrap: pretty; }
  .pd-tie .pd-eyebrow { font: 600 11.5px/1.3 var(--sans); letter-spacing: .01em; color: var(--faint); }
  .pd-tie h4 { margin: 0; font: 400 21px/1.18 var(--display); color: var(--text); text-wrap: balance; }
  .pd-tie h4 span { color: var(--leaf); }
  .pd-tie > p:not([class]) { color: #d3dccf; font-size: 12.5px; line-height: 1.55; }
  .pd-tie .pd-links { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 2px; }
  .pd-tie .pd-links .btn { text-decoration: none; font-size: 12.5px; padding: 8px 10px; white-space: normal; text-align: center; }
  .pd-tie .pd-links .btn:first-child { grid-column: 1 / -1; }
  .pd-tie .pd-note { font-size: 11.5px; color: var(--faint); }

  /* ── toast ── */
  .toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 90; justify-items: center; pointer-events: none; }
  .toast { background: #1c3b2df2; color: var(--text); border: 1px solid #b8e59a55; padding: 9px 16px; border-radius: 999px; font-weight: 600; box-shadow: 0 16px 40px #000b; animation: rise .25s var(--ease); backdrop-filter: blur(8px); display: flex; gap: 9px; align-items: center; }
  .toast::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 10px var(--leaf); }

  /* ── about ── */
  .about-pane p { color: #cbd6c7; font-size: 13px; line-height: 1.6; margin: 0; }
  .about-pane .pledge { display: grid; gap: 8px; }
  .about-pane .pledge div { display: flex; gap: 10px; align-items: baseline; color: #d8e1d3; }
  .about-pane .lead { font: 400 22px/1.25 var(--display); color: var(--text); }
  .about-pane .guide { display: grid; gap: 9px; scroll-margin-top: 96px; }
  .about-pane .guide .tip { font-size: 12.5px; line-height: 1.55; color: #cbd6c7; padding-left: 12px; border-left: 2px solid var(--line2); }
  .about-pane .guide .tip b { color: var(--text); font-weight: 650; }
  .intro a { color: var(--leaf); white-space: nowrap; }
  .about-pane .why { border-top: 1px solid var(--line); padding-top: 14px; }
  .about-pane .why a { color: var(--leaf); text-decoration-color: #b8e59a66; text-underline-offset: .2em; white-space: nowrap; }
  .intro { margin: 2px 20px 6px; padding: 16px 16px 14px; border-radius: 14px; border: 1px solid #b8e59a40; background: radial-gradient(120% 140% at 0% 0%, #1c3d2c, #12291e 62%); position: relative; }
  .intro h3 { margin: 0 26px 6px 0; font: 400 23px/1.15 var(--display); }
  .intro p { margin: 0; color: #d3dccf; font-size: 12.5px; line-height: 1.55; }
  .intro .x { position: absolute; top: 8px; right: 8px; }
  /* the leaf brackets from the identity: one bracketed phrase per screen, display type only */
  .leafb { display: inline-block; width: .3976em; height: 1.24em; vertical-align: -.3em; background: var(--leaf); -webkit-mask: url('assets/leaf-left.svg') center / contain no-repeat; mask: url('assets/leaf-left.svg') center / contain no-repeat; }
  .leafb.r { -webkit-mask-image: url('assets/leaf-right.svg'); mask-image: url('assets/leaf-right.svg'); }
  .about-pane .pledge div::before { content: '✦'; color: var(--leaf); font-size: 11px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

  /* ── phones and small tablets ── */
  @media (max-width: 1100px) { .shell { grid-template-columns: 70px 330px minmax(0, 1fr); } .studio { grid-template-columns: 240px minmax(0, 1fr) 290px; } }
  @media (max-width: 860px) {
    body { grid-template-rows: auto minmax(0, 1fr); overflow: auto; height: auto; min-height: 100%; }
    html, body { height: auto; }
    header.top { flex-wrap: wrap; gap: 8px 10px; padding: 10px 12px; position: sticky; top: 0; }
    .brand { order: 1; }
    .top-actions { order: 2; }
    .tagline { order: 3; width: 100%; margin: -2px 0 2px; padding: 0; border: 0; font-size: 12px; }
    .tagline { white-space: normal; }
    .tagline .tl2 { display: inline; white-space: nowrap; }
    .modes { order: 4; width: 100%; justify-content: space-between; }
    .modes button { flex: 1; padding: 6px 4px; }
    .top-actions .btn.ghost .lbl { display: none; }
    .shell { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    main { order: 1; }
    .stagearea { min-height: 0; }
    .modepanel { max-height: none; overflow-x: auto; }
    .rowtable { min-width: 620px; } /* the table scrolls sideways rather than squeezing every field */
    .rail { order: 2; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; position: sticky; top: var(--hh, 98px); z-index: 4; }
    .rail button { flex: 1 0 64px; }
    .rail button.on::before { left: 12px; right: 12px; top: auto; bottom: -6px; width: auto; height: 3px; border-radius: 3px 3px 0 0; }
    .rail .grow, .rail .about { display: none; }
    aside.panel { order: 3; overflow: visible; border-right: 0; }
    .tabhead { position: static; }
    .stagewrap { padding: 16px 16px 56px; }
    .stage svg { max-height: 52vh; }
    .stagearea { flex: none; flex-direction: column; }
    .stagearea > .stagewrap { flex: none; }
    .small-sizes { position: static; margin: 0 16px 60px; max-width: none; contain: inline-size; }
    .small-sizes .ss-row { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
    .stagearea.ss-side > .stagewrap, .stagearea.ss-below > .stagewrap { padding: 16px 16px 56px; }
    .stagearea.ss-below .small-sizes { max-height: none; overflow: visible; }
    .scrim { padding: 0; }
    .modal { height: 100%; border-radius: 0; }
    .studio { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .studio > * { overflow: visible !important; }
    .studio .dests { display: grid; overflow-x: auto !important; }
    .studio .dests { border-right: 0; border-bottom: 1px solid var(--line); grid-auto-flow: column; grid-auto-columns: 220px; overflow-x: auto; overflow-y: hidden; }
    .studio .dgroup { display: none; }
    .studio .preview { min-height: 320px; height: auto; } /* D45: grows with stacked previews, so nothing overlaps what follows */
    .studio .opts { border-left: 0; }
    /* on a phone the main download stays in reach while the options scroll */
    .studio .opts > .go { position: sticky; bottom: 0; z-index: 2; margin: 0 -18px; padding: 16px 18px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, #12291e00, var(--panel) 28%); }
    .studio .opts > .go ~ .go { position: static; margin: 0; padding: 0; background: none; }
    .studio.fixer { grid-template-columns: 1fr; }
    .studio.fixer .opts { border-left: 0; border-top: 1px solid var(--line); }
    .sigs { grid-template-columns: minmax(0, 1fr); }
    .report { bottom: 44px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><img class="logo" src="assets/daphne-logo-on-dark.svg" alt="Daphne" width="103" height="29"></a>
  <p class="tagline">Make festival laurels for your film. <span class="tl2"><b>It’s free.</b> <a class="her" href="story/">Why Daphne?</a></span></p>
  <div class="modes" id="modes" role="tablist" aria-label="View">
    <button class="on" data-mode="laurel" role="tab">Laurel</button>
    <button data-mode="poster" role="tab" title="See it on your poster: placement, readable ink, colors from the artwork">On poster</button>
    <button data-mode="row" role="tab" title="Several laurels in one look: same type size, prestige order">Row</button>
    <button data-mode="motion" role="tab" title="An animated end card: the leaves grow in, then a shimmer">Motion</button>
  </div>
  <div class="top-actions">
    <span id="savestate" class="savestate" role="status" hidden title="Storage is full or blocked in this browser. Use Share link to keep this laurel.">Not saved</span>
    <button class="icon-btn" id="undo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="icon-btn" id="redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="btn ghost" id="copy-link" aria-label="Copy a share link" title="A link that holds the whole laurel. Nothing is stored on a server."><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span class="lbl">Share link</span></button>
    <button class="btn primary" id="open-export" title="Every file you need: PNG, SVG, PDF, social, trailer, web, the whole kit (⌘E)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Export</button>
  </div>
</header>
<div class="shell">
  <nav class="rail" id="rail" role="tablist" aria-label="Edit"></nav>
  <aside class="panel" id="panel" aria-label="Controls"><div id="sections"></div></aside>
  <main id="main">
    <div class="modebar" id="modebar"></div>
    <div class="stagearea" id="stagearea">
      <div class="stagewrap" id="stagewrap"><div class="stage" id="stage"></div></div>
      <div class="report" id="report" aria-live="polite"></div>
      <div class="stagebar" id="stagebar"></div>
    </div>
    <div class="bottom">
      <div class="modepanel" id="modepanel"></div>
      <div class="notes" id="notes"></div>
    </div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
