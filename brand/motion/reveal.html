<script>function daphneReveal(svg, id) {
  const R = {"fps":24,"total":2.6,"leaf":1.05,"leafStagger":0.08333333333333333,"wordAt":0.5,"letter":0.55,"letterStagger":0.08333333333333333,"rise":70}, ms = (s) => s * 1000, grow = 'cubic-bezier(.2,.7,.1,1)', settle = 'cubic-bezier(.33,0,.15,1)';
  const anims = [];
  svg.querySelectorAll('.' + id + '-g').forEach((p, i) => anims.push(p.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: ms(R.leaf), delay: ms(i * R.leafStagger), easing: grow, fill: 'both' })));
  svg.querySelectorAll('.' + id + '-l').forEach((g, i) => anims.push(g.animate([{ opacity: 0, transform: 'translateY(' + R.rise + 'px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: ms(R.letter), delay: ms(R.wordAt + i * R.letterStagger), easing: settle, fill: 'both' })));

}
const svg = document.querySelector('svg.rv'), anims = daphneReveal(svg, 'rv'), fps = 24;
const scrub = document.getElementById('scrub'), fr = document.getElementById('fr');
const seek = (n) => { anims.forEach((a) => { a.pause(); a.currentTime = n * 1000 / fps; }); scrub.value = n; fr.textContent = n + ' / ' + scrub.max; };
