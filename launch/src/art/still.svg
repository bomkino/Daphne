<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="1080" height="1350">
  <!-- A still from a film nobody made: a lighthouse on a cliff at blue hour, its beam across the sky.
       The carousel "The lineup is out" puts it behind a social card, the way a filmmaker would use their own still. -->
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06101F"/><stop offset=".45" stop-color="#14294A"/><stop offset=".72" stop-color="#3F5F86"/><stop offset=".86" stop-color="#9AA9BA"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F1E6" stop-opacity=".75"/><stop offset=".5" stop-color="#E9EEF4" stop-opacity=".22"/><stop offset="1" stop-color="#E9EEF4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="284" cy="300" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8E6"/><stop offset=".25" stop-color="#FFF1CC" stop-opacity=".8"/><stop offset="1" stop-color="#FFF1CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B4466"/><stop offset="1" stop-color="#050B16"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#s)"/>
  <g fill="#E8EEF6" opacity=".7">
    <circle cx="40" cy="40" r=".9"/><circle cx="92" cy="74" r=".7"/><circle cx="150" cy="30" r="1"/><circle cx="210" cy="64" r=".6"/><circle cx="262" cy="22" r=".8"/>
    <circle cx="330" cy="58" r="1"/><circle cx="372" cy="30" r=".7"/><circle cx="66" cy="120" r=".6"/><circle cx="120" cy="150" r=".8"/><circle cx="350" cy="130" r=".6"/>
    <circle cx="24" cy="190" r=".7"/><circle cx="180" cy="110" r=".7"/><circle cx="300" cy="100" r=".5"/><circle cx="388" cy="176" r=".7"/>
  </g>
  <!-- the beam, sweeping left across the sky -->
  <path d="M284 300 L-20 196 L-20 262 Z" fill="url(#beam)" transform="rotate(0 284 300)"/>
  <!-- the sea, with a long reflection -->
  <rect y="352" width="400" height="148" fill="url(#sea)"/>
  <g stroke="#C9D6E6" stroke-linecap="round" opacity=".35">
    <path d="M20 372 h40 M90 384 h28 M30 404 h22 M140 396 h34 M60 430 h26 M180 420 h20 M110 452 h30 M24 470 h18"/>
  </g>
  <!-- the cliff and the lighthouse -->
  <path d="M220 352 C236 330 250 322 262 318 L310 316 C330 318 352 326 372 340 C384 348 394 350 400 350 L400 500 L190 500 C196 440 204 380 220 352Z" fill="#070E18"/>
  <path d="M276 318 L279 266 L289 266 L292 318 Z" fill="#DCE3EC"/>
  <path d="M277.4 300 h13.2 v6 h-13.2 z M278.2 284 h11.6 v5 h-11.6 z" fill="#9B2C2C" opacity=".85"/>
  <rect x="277" y="258" width="14" height="9" fill="#FFF4D8"/>
  <path d="M275 258 h18 l-9 -8 z" fill="#0B1422"/>
  <circle cx="284" cy="262" r="30" fill="url(#lamp)"/>
  <rect x="270" y="318" width="28" height="4" fill="#0B1422"/>
  <!-- the keeper's house -->
  <path d="M300 322 h22 v-12 l-11 -8 l-11 8 z" fill="#0B1422"/>
  <rect x="306" y="314" width="4" height="4" fill="#FFE7B0" opacity=".8"/>
</svg>
