<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <!-- A love story nobody made: two people under a cherry tree at dusk. Its laurel is Cherry Blossom. -->
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D1218"/><stop offset=".45" stop-color="#4A2140"/><stop offset=".72" stop-color="#B85A7E"/><stop offset=".82" stop-color="#F0A3B8"/></linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B1424"/><stop offset="1" stop-color="#120A10"/></linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#s)"/>
  <!-- the hill -->
  <path d="M0 470 C90 446 170 440 240 450 C310 460 360 452 400 444 L400 600 L0 600Z" fill="url(#h)"/>
  <!-- the tree: trunk and branches reaching right across the sky -->
  <g fill="none" stroke="#120A10" stroke-linecap="round">
    <path d="M92 470 C96 420 92 380 104 340 C112 312 132 292 160 276" stroke-width="9"/>
    <path d="M104 344 C140 330 190 330 236 312 C270 298 300 300 336 286" stroke-width="5"/>
    <path d="M160 276 C190 256 214 250 250 236 M120 316 C96 296 72 290 44 288 M236 312 C250 330 270 340 300 342 M200 328 C210 350 224 360 246 366" stroke-width="3.4"/>
  </g>
  <!-- blossoms -->
  <g fill="#F8B9CB">
    <circle cx="250" cy="236" r="9" opacity=".9"/><circle cx="236" cy="226" r="7"/><circle cx="264" cy="228" r="6"/><circle cx="214" cy="248" r="8" opacity=".85"/>
    <circle cx="336" cy="286" r="9"/><circle cx="322" cy="276" r="6" opacity=".8"/><circle cx="350" cy="296" r="7"/><circle cx="300" cy="292" r="6"/>
    <circle cx="300" cy="342" r="8"/><circle cx="314" cy="334" r="5"/><circle cx="246" cy="366" r="7"/><circle cx="232" cy="358" r="5" opacity=".8"/>
    <circle cx="44" cy="288" r="8"/><circle cx="58" cy="278" r="6" opacity=".85"/><circle cx="34" cy="300" r="5"/>
    <circle cx="160" cy="276" r="8"/><circle cx="176" cy="264" r="6"/><circle cx="196" cy="320" r="6" opacity=".8"/><circle cx="140" cy="300" r="5"/>
    <circle cx="190" cy="258" r="5" opacity=".8"/><circle cx="276" cy="306" r="5" opacity=".8"/>
  </g>
  <g fill="#FFE3EA" opacity=".85">
    <circle cx="252" cy="234" r="3"/><circle cx="338" cy="284" r="3"/><circle cx="302" cy="340" r="3"/><circle cx="46" cy="286" r="3"/><circle cx="162" cy="274" r="3"/><circle cx="216" cy="246" r="2.4"/>
  </g>
  <!-- petals falling -->
  <g fill="#F8B9CB" opacity=".7"><ellipse cx="270" cy="400" rx="2.6" ry="1.4" transform="rotate(30 270 400)"/><ellipse cx="330" cy="380" rx="2.6" ry="1.4" transform="rotate(-20 330 380)"/><ellipse cx="210" cy="420" rx="2.4" ry="1.3" transform="rotate(50 210 420)"/><ellipse cx="150" cy="390" rx="2.4" ry="1.3"/></g>
  <!-- two people, close -->
  <g fill="#120A10">
    <circle cx="230" cy="420" r="6.4"/><path d="M223 428 C220 440 220 452 221 462 L238 462 C238 452 238 440 236 428 Z"/>
    <circle cx="246" cy="418" r="6.8"/><path d="M239 426 C237 438 236 452 237 462 L255 462 C255 450 254 438 252 426 Z"/>
  </g>
  <g fill="#FFE3EA" opacity=".38"><rect x="90" y="566" width="220" height="2.2"/><rect x="115" y="572" width="170" height="2.2"/><rect x="140" y="578" width="120" height="2.2"/></g>
</svg>
